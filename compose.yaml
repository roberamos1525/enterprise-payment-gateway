# NOTE: not run locally (Docker is not available on the development machine).
# Local demo stack: the gateway plus the bundled webhook receiver.
# Copy .env.example to .env and fill in the secrets first.
services:
  gateway:
    build: .
    image: enterprise-payment-gateway:local
    env_file: .env
    environment:
      GATEWAY_DB_PATH: /data/gateway.db
      GATEWAY_LISTEN_ADDR: 0.0.0.0:8080
      # The receiver lives on the compose network, so private targets and
      # plain HTTP must be allowed for this demo only.
      GATEWAY_WEBHOOK_ALLOW_HTTP: "true"
      GATEWAY_WEBHOOK_ALLOW_PRIVATE: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gateway-data:/data
    restart: unless-stopped

  webhook-receiver:
    image: enterprise-payment-gateway:local
    depends_on: [gateway]
    entrypoint: ["/usr/local/bin/webhook-receiver", "-addr", "0.0.0.0:9090", "-out", "/data/webhooks.ndjson"]
    environment:
      # Set to the secret returned when you register http://webhook-receiver:9090/hooks
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-replace-me}
    volumes:
      - receiver-data:/data

volumes:
  gateway-data:
  receiver-data:
